name: ARMSX2 Android Core Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-android:
    name: Build pinned ARMSX2 Android candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EmuCraft
        uses: actions/checkout@v4

      - name: Checkout pinned ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: a2914992c8c507d4c196464dbcf773fc7b0d0def
          path: upstream/ARMSX2
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android native toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Fetch shaderc third-party dependencies
        working-directory: upstream/ARMSX2/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Verify upstream pin and Android build configuration
        working-directory: upstream/ARMSX2
        run: |
          test "$(git rev-parse HEAD)" = "a2914992c8c507d4c196464dbcf773fc7b0d0def"
          grep -q 'ndkVersion.*29.0.14206865' platforms/android/app/build.gradle.kts
          grep -q 'compileSdk = 37' platforms/android/app/build.gradle.kts
          git status --short

      - name: Build upstream Android debug APK
        working-directory: upstream/ARMSX2/platforms/android
        run: ./gradlew --no-daemon :app:assembleGithubDebug --stacktrace

      - name: Upload upstream probe APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx2-upstream-probe-apk
          path: upstream/ARMSX2/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
