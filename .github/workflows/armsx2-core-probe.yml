name: ARMSX2 Android Core Probe

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/armsx2-core-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-upstream-android:
    name: Build pinned ARMSX2 Android candidate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EmuCraft
        uses: actions/checkout@v4

      - name: Checkout pinned ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: a2914992c8c507d4c196464dbcf773fc7b0d0def
          path: upstream/ARMSX2
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The upstream branch currently declares API 37, but that SDK package is
      # not published in the runner's configured repositories. Probe with API 36
      # while keeping the pinned NDK/CMake versions and ARM64 target unchanged.
      - name: Install available Android native toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Adapt probe to API 36-compatible AndroidX dependencies
        working-directory: upstream/ARMSX2
        run: |
          # API 37 is not available from the runner SDK repository yet. Keep the
          # upstream app's minSdk and ARM64 target, but use the latest dependency
          # lines that do not declare compileSdk 37 as their minimum.
          sed -i 's/compileSdk = 37/compileSdk = 36/' platforms/android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' platforms/android/app/build.gradle.kts
          sed -i 's/coreKtx = "1.19.0"/coreKtx = "1.18.0"/' platforms/android/gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.10.0"/' platforms/android/gradle/libs.versions.toml
          grep -q 'compileSdk = 36' platforms/android/app/build.gradle.kts
          grep -q 'targetSdk = 36' platforms/android/app/build.gradle.kts
          grep -q 'coreKtx = "1.18.0"' platforms/android/gradle/libs.versions.toml
          grep -q 'lifecycle = "2.10.0"' platforms/android/gradle/libs.versions.toml
          grep -q 'ndkVersion.*29.0.14206865' platforms/android/app/build.gradle.kts

      - name: Fetch shaderc third-party dependencies
        working-directory: upstream/ARMSX2/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Verify upstream pin and ARM64 configuration
        working-directory: upstream/ARMSX2
        run: |
          test "$(git rev-parse HEAD)" = "a2914992c8c507d4c196464dbcf773fc7b0d0def"
          grep -q 'abiFilters.add("arm64-v8a")' platforms/android/app/build.gradle.kts
          git diff --check

      - name: Build upstream Android debug APK
        working-directory: upstream/ARMSX2/platforms/android
        run: ./gradlew --no-daemon :app:assembleGithubDebug --stacktrace

      - name: Upload upstream probe APK
        uses: actions/upload-artifact@v4
        with:
          name: armsx2-upstream-probe-apk
          path: upstream/ARMSX2/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
