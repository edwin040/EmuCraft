name: EmuCraft Android APK Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build EmuCraft from ARMSX2 Android base
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout EmuCraft build configuration
        uses: actions/checkout@v4

      - name: Checkout pinned ARMSX2 source
        uses: actions/checkout@v4
        with:
          repository: ARMSX2/ARMSX2
          ref: a2914992c8c507d4c196464dbcf773fc7b0d0def
          path: upstream/ARMSX2
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android native toolchain
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Adapt pinned source to available API 36 SDK
        working-directory: upstream/ARMSX2
        run: |
          # The pinned upstream revision requests API 37. Use API 36 and the
          # matching AndroidX lines for this CI runner; do not change native ABI.
          sed -i 's/compileSdk = 37/compileSdk = 36/' platforms/android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' platforms/android/app/build.gradle.kts
          sed -i 's/coreKtx = "1.19.0"/coreKtx = "1.18.0"/' platforms/android/gradle/libs.versions.toml
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.10.0"/' platforms/android/gradle/libs.versions.toml
          grep -q 'compileSdk = 36' platforms/android/app/build.gradle.kts
          grep -q 'targetSdk = 36' platforms/android/app/build.gradle.kts
          grep -q 'coreKtx = "1.18.0"' platforms/android/gradle/libs.versions.toml
          grep -q 'lifecycle = "2.10.0"' platforms/android/gradle/libs.versions.toml
          grep -q 'ndkVersion.*29.0.14206865' platforms/android/app/build.gradle.kts
          # CI already installs JDK 17; remove Foojay auto-provisioner to avoid
          # fragile external plugin-portal resolution during settings evaluation.
          python3 - <<'PY'
          from pathlib import Path
          p = Path("platforms/android/settings.gradle.kts")
          text = p.read_text()
          block = '''plugins {
              id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
          }
          '''
          if block not in text:
              raise SystemExit("Foojay plugin block not found; refusing unexpected settings edit")
          p.write_text(text.replace(block, "", 1))
          PY

      - name: Apply EmuCraft UI customization
        run: python3 scripts/apply-emucraft-ui.py

      - name: Fetch shaderc third-party dependencies
        working-directory: upstream/ARMSX2/platforms/android
        run: python3 app/src/main/cpp/3rdparty/shaderc/utils/git-sync-deps

      - name: Install Rust Android target
        run: rustup target add aarch64-linux-android

      - name: Verify upstream revision and ARM64 target
        working-directory: upstream/ARMSX2
        run: |
          test "$(git rev-parse HEAD)" = "a2914992c8c507d4c196464dbcf773fc7b0d0def"
          grep -q 'abiFilters.add("arm64-v8a")' platforms/android/app/build.gradle.kts
          git diff --check

      - name: Build EmuCraft APK
        working-directory: upstream/ARMSX2/platforms/android
        run: |
          ./gradlew --no-daemon :app:assembleGithubDebug --stacktrace \
            -Parmsx2.applicationId=com.emucraft.ps2 \
            -Parmsx2.appLabel=EmuCraft

      - name: Upload EmuCraft ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: emucraft-arm64-debug-apk
          path: upstream/ARMSX2/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
